# Critères d'évaluation du travail pratique
---
criteria:
  late:
    $description: Pénalité de rendu en cas de retard
    $points: [0, -10]
  build:
    $description: Compilation du code
    with-no-errors:
      $description: Aucune erreur de compilation
      $points: [0, -2]
    with-no-warnings:
      $description: Aucune alerte de compilation
      $points: [0, -2]
  binary:
    $description: Exécutable binaire
    menu:
      display:
        $description: Le menu s'affiche correctement avec le prompt
        $points: [0, 5]
      capture:
        $description: |
          - Le menu fonctionne, les bonnes options sont sélectionnées.
          - En cas d'erreur le menu est à nouveau affiché et l'utilisateur est notifié.
        $points: [0, 5]
    version:
      $description: Le programme affiche la version
      $points: [0, 5]
    aide:
      $description: Le programme affiche l'aide
      $points: [0, 5]
    multiplication:
      values:
        $description: Les valeurs de la table de multiplication sont correctes
        $points: [0, 3]
      alignment:
        $description: L'alignement des chiffres respecte le cahier des charges
        $points: [0, 3]
      columns:
        $description: Le nombre de colonnes est celui attendu
        $points: [0, 2]
      negative:
        $description: Les valeurs négatives sont gérées
        $points: [0, 2]
  testing:
    report:
      $description: Le rapport de test est présent et complet
      $points: [0, 5]
    tests:
      $description: Les tests dans test.yml passent
      $points: [0, 5]
  code:
    $description: Code source
    minimalism:
      $description: Le code est minimaliste et optimum
      $points: [0, -3]
    header:
      $description: Une explication succincte du programme figure en tête de programme
      $points: [0, -3]
    types:
      $description: Les bons types de données sont utilisés (int, bool, ...)
      $points: [0, -2]
    constants:
      $description: Des constantes symboliques sont utilisées si nécessaire
      $points: [0, -2]
    comments:
      $description: |
        - Les commentaires sont utiles
        - Les commentaires expliquent pourquoi et non comment
        - Les commentaires ne sont pas surnuméraires
      $points: [0, -3]
    flow-control:
      $description: Bon choix de structure de contrôles (boucles embranchement)
      $points: [0, -3]
    consistency:
      $description: Les conventions d'édition choisies sont cohérentes et harmonieuses
      $points: [0, -2]
    variables:
      $description: |
        - Choix des noms approprié
        - Scope des variable adapté
        - Les types de données sont convenablement choisis
      $points: [0, -2]
    no-dead-code:
      $description: Il n'y a pas de code mort, non exécuté ou inutile
      $points: [0, -1]
    dry:
      $description: Le code ne contient pas de répétitions
      $points: [0, -2]
    english:
      $description: Un effort est mis sur l'utilisation de l'anglais
      $points: [0, -1]
    indentation:
      consistency:
        $description: L'indentation du code est cohérente et valide
        $points: [0, -5]
  bonus:
    $description: Bonus
    creativity:
      $description: L'étudiant a apporté de la créativité au projet.
      $bonus: [0, 1]
    proactivity:
      $description: L'étudiant a démontré une certaine proactivité en allant plus loin que le cahier des charges initial.
      $bonus: [0, 1]
    tests:
      $description: L'étudiant a implémenté des tests automatiques supplémentaires
      $bonus: [0, 2]
