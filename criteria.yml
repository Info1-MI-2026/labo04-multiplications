# Critères d'évaluation du travail pratique
---
details:
  binary:
    $description: Exécutable binaire
    menu:
      $description: Le menu s'affiche correctement avec le prompt
      $points: [0, 2]
    version:
      $description: Le programme affiche la version
      $points: [0, 2]
    aide:
      $description: Le programme affiche l'aide
      $points: [0, 2]
    saisie:
      scanf:
        $description: Le programme saisit les valeurs au clavier sur stdin
        $points: [0, 2]
      default:
        $description: Les valeurs par défaut sont prise en compte et affichées à l'écran
        $points: [0, 2]
    multiplication:
      values:
        $description: Les valeurs de la table de multiplication sont correctes
        $points: [0, 3]
      alignment:
        $description: L'alignement des chiffres est cohérent
        $points: [0, 2]
      columns:
        $description: Le nombre de colonne est celui attendu
        $points: [0, 2]
      negative:
        $description: Les valeurs négatives sont gérées
        $points: [0, 2]
  testing:
    $description: Rapport de test présent et complet
    $points: [0, 5]
  functional-tests:
    $description: Des tests automatiques existent
    $points: [0, 5]
  build:
    $description: Compilation du code
    with-no-errors:
      $description: Aucune erreur de compilation
      $points: [0, -2]
    with-no-warnings:
      $description: Aucune alerte de compilation
      $points: [0, -2]
  code:
    description: Code source
    minimalism:
      $description: Le code est minimaliste et optimum
      $points: [0, -2]
    header:
      $description: Une explication succinte du programme figure en tête de programme
      $points: [0, -2]
    types:
      $description: Les bons types de données sont utilisés (int, bool, ...)
      $points: [0, -2]
    constants:
      $description: Des constantes symboliques sont utilisées
      $points: [0, -2]
    comments:
      $description:
        - Les commentaires sont utiles
        - Les commentaires expliquent pourquoi et non comment
        - Les commentaires ne sont pas surnuméraires
      $points: [0, -3]
    flow-control:
      $description:
        - Bon choix de structure de données
        - Bonne utilisation des structures de données
      $points: [0, -3]
    consistency:
      $description: Les conventions d'édition choisies sont cohérentes et harmonieuses
      $points: [0, 1]
    variables:
      $description:
        - Choix des noms approprié
        - Scope des variable adapté
        - Les types de données sont convenablement choisis
      $points: [0, -2]
    no-dead-code:
      $description: Il n'y a pas de code mort, non exécuté ou inutile
      $points: [0, -1]
    dry:
      description: Le code ne contient pas de répétitions
      $points: [0, -2]
    english:
      $description: Un effort est mis sur l'utilisation de l'anglais
      $points: [0, -1]
    indentation:
      consistency:
        $description: L'indentation du code est cohérente et valide
        $points: [0, -5]
  bonus:
    description: Bonus
    creativity:
      $description: L'étudiant a apporté de la créativité au projet.
      $bonus: [0, 1]
    proactivity:
      $description: L'étudiant a démontré une certaine proactivité en allant plus loin que le cahier des charges initial.
      $bonus: [0, 1]
    rigourous:
      $description: L'étudiant s'est montré rigoureux avec la donnée, son travail et le résultat obtenu.
      $bonus: [0, 1]
    references:
      $description: Des références sont faites sur les sources des données extérieures.
      $bonus: [0, 1]
